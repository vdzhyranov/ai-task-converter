version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devinsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devinsight
      POSTGRES_PASSWORD: devinsight_password
      POSTGRES_DB: devinsight
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devinsight']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local